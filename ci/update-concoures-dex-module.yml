---
platform: linux

image_resource:
  type: registry-image
  source: {repository: cgr.dev/chainguard/wolfi-base}

inputs:
  - name: concourse
  - name: concourse-dex-tag

params:
  GITHUB_TOKEN:

run:
  path: sh
  args:
    - -c
    - |
      apk add --quiet --no-progress \
      bash \
      cmd:git \
      cmd:xargs \
      cmd:ssh-keyscan\
      cmd:grep \
      cmd:sed

      ./concourse-dex/ci/scripts/update-concourse-dex-module
