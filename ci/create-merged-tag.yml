---
platform: linux

image_resource:
  type: registry-image
  source: {repository: concourse/unit}

inputs:
  - name: dex
  - name: dex-github-release
  - name: concourse-dex-version

params:
  CONCOURSE_DEX_DEPLOY_KEY:

run:
  path: sh
  args:
    - -c
    - |
      apk add --quiet --no-progress \
      bash \
      cmd:git \
      cmd:xargs \
      cmd:ssh \
      cmd:ssh-keyscan \
      cmd:grep \
      cmd:sed \
      cmd:make

      ./dex/ci/scripts/create-merged-tag
